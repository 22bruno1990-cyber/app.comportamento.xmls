<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">DocSignal technology background</title>
  <desc id="desc">Dark technology scene with data grid, document shards, signal paths and scanning glow</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1780" y2="1020" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020817"/>
      <stop offset=".42" stop-color="#07111f"/>
      <stop offset=".72" stop-color="#102844"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5cc8ff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#5cc8ff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#d89b37" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fbff" stop-opacity=".82"/>
      <stop offset="1" stop-color="#7fa7d8" stop-opacity=".34"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#5cc8ff" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.7" fill="#5cc8ff" fill-opacity=".18"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.78 0 0 0 0 1 0 0 0 .8 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M-80 775C180 540 410 476 650 566c197 74 315 256 540 242 232-14 398-224 832-172" fill="none" stroke="#5cc8ff" stroke-opacity=".18" stroke-width="22" filter="url(#blur)"/>
  <path d="M-140 704C178 502 426 444 682 530c216 73 350 242 584 220 262-24 442-214 790-150" fill="none" stroke="#5cc8ff" stroke-opacity=".54" stroke-width="4"/>
  <path d="M-100 846C210 590 466 526 728 626c218 83 334 260 580 236 222-22 412-182 690-148" fill="none" stroke="#d89b37" stroke-opacity=".32" stroke-width="5"/>
  <g opacity=".9">
    <path d="M268 202h168l70 70v216H268V202z" fill="url(#doc)" stroke="#dbeafe" stroke-opacity=".32"/>
    <path d="M436 202v70h70" fill="#5cc8ff" fill-opacity=".18"/>
    <path d="M312 316h142M312 362h118M312 408h156" stroke="#07111f" stroke-opacity=".54" stroke-width="13" stroke-linecap="round"/>
  </g>
  <g opacity=".72" transform="translate(1240 154) rotate(10)">
    <path d="M0 0h190l74 76v244H0V0z" fill="url(#doc)" stroke="#dbeafe" stroke-opacity=".24"/>
    <path d="M190 0v76h74" fill="#5cc8ff" fill-opacity=".14"/>
    <path d="M48 124h136M48 174h170M48 224h92" stroke="#07111f" stroke-opacity=".48" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g opacity=".54" transform="translate(922 640) rotate(-8)">
    <path d="M0 0h150l60 62v188H0V0z" fill="url(#doc)" stroke="#dbeafe" stroke-opacity=".20"/>
    <path d="M150 0v62h60" fill="#5cc8ff" fill-opacity=".12"/>
    <path d="M40 104h120M40 146h86" stroke="#07111f" stroke-opacity=".42" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g filter="url(#glow)">
    <path d="M250 752l282-152 300 66 318-162 286 128 296-210" fill="none" stroke="#5cc8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="752" r="12" fill="#5cc8ff"/>
    <circle cx="532" cy="600" r="15" fill="#f8fbff"/>
    <circle cx="832" cy="666" r="13" fill="#5cc8ff"/>
    <circle cx="1150" cy="504" r="18" fill="#d89b37"/>
    <circle cx="1436" cy="632" r="13" fill="#5cc8ff"/>
    <circle cx="1732" cy="422" r="16" fill="#f8fbff"/>
  </g>
  <rect x="-200" y="475" width="2320" height="18" fill="url(#scan)" opacity=".4" transform="rotate(-7 960 540)"/>
  <rect x="-200" y="530" width="2320" height="3" fill="url(#scan)" opacity=".8" transform="rotate(-7 960 540)"/>
  <g opacity=".28">
    <text x="118" y="884" fill="#dbeafe" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" letter-spacing="3">SCORE 87  |  DUPLICIDADE  |  HISTORICO  |  ALERTA</text>
    <text x="1084" y="276" fill="#5cc8ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="2">XML SIGNAL / BEHAVIOR MAP / REVIEW QUEUE</text>
    <text x="1218" y="906" fill="#d89b37" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" letter-spacing="2">RISK PRIORITY ENGINE</text>
  </g>
  <rect width="1920" height="1080" fill="#020817" opacity=".22"/>
</svg>
